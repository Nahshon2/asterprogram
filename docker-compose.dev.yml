version: '3.9'

# Development override — runs only infrastructure services
# Use this with: docker-compose -f docker-compose.dev.yml up -d
# Then run frontend and backend locally

services:
  postgres:
    image: postgres:16-alpine
    container_name: docidentity_postgres_dev
    environment:
      POSTGRES_DB: doctor_identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docidentity_redis_dev
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: docidentity_minio_dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_dev_data:
  minio_dev_data:
